<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סיכום מוצרים לאירוע - הפרתיה</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #E67E22 0%, #D35400 50%, #A0522D 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #FFF8DC 0%, #F5F5DC 100%);
            color: #8B4513;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #E67E22;
        }
        
        .header-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .header-text h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            color: #8B4513;
        }
        
        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: #5a6268;
        }
        
        .content {
            padding: 30px 40px;
        }
        
        .controls {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
        }
        
        .controls-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-items: end;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #E67E22;
        }
        
        .date-mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .mode-btn {
            background: white;
            color: #6c757d;
            border: 2px solid #e0e0e0;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: #E67E22;
            color: white;
            border-color: #E67E22;
        }
        
        .date-range-group {
            display: flex;
            gap: 10px;
            align-items: end;
        }
        
        .date-range-group.hidden {
            display: none;
        }
        
        .generate-btn {
            background: linear-gradient(135deg, #E67E22, #D35400);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            height: fit-content;
        }
        
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
        }
        
        .generate-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-section {
            display: none;
        }
        
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #dee2e6;
        }
        
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #E67E22;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #6c757d;
            font-size: 14px;
        }
        
        /* גרף יחיד */
        .chart-section {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #e9ecef;
            max-width: 600px;
            width: 100%;
        }
        
        .chart-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .chart-canvas {
            width: 100%;
            height: 400px;
            max-height: 400px;
        }
        
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .export-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
        }
        
        .export-btn:hover {
            background: #218838;
        }
        
        .table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #e9ecef;
        }
        
        .products-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .products-table th {
            background: linear-gradient(135deg, #E67E22, #D35400);
            color: white;
            padding: 15px 12px;
            text-align: right;
            font-weight: bold;
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .products-table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        
        .products-table tr:hover {
            background: #f8f9fa;
        }
        
        .product-name {
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .product-emoji {
            font-size: 18px;
        }
        
        .quantity-cell {
            font-size: 18px;
            font-weight: bold;
            color: #E67E22;
        }
        
        .percentage-cell {
            color: #6c757d;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top-color: #E67E22;
            border-radius: 50%;
            animation: spin 1s ease infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .no-data {
            text-align: center;
            padding: 50px;
            color: #6c757d;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        /* רספונסיביות */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                max-width: none;
            }
            
            .content {
                padding: 20px;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
            
            .controls-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .date-range-group {
                flex-direction: column;
                gap: 15px;
            }
            
            .chart-container {
                padding: 15px;
            }
            
            .chart-canvas {
                height: 300px;
                max-height: 300px;
            }
            
            .summary-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .products-table {
                font-size: 12px;
            }
            
            .products-table th,
            .products-table td {
                padding: 8px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <a href="admin.html">
                    <img src="logo.png" alt="לוגו הפרתיה" class="logo">
                </a>
                <div class="header-text">
                    <h1>📦 סיכום מוצרים לאירוע</h1>
                </div>
            </div>
            <a href="admin.html" class="back-btn">← חזור לעמוד הראשי</a>
        </div>
        
        <div class="content">
            <!-- בקרות -->
            <div class="controls">
                <div class="controls-row">
                    <div class="form-group">
                        <label>סוג דוח:</label>
                        <div class="date-mode-toggle">
                            <button type="button" class="mode-btn active" id="singleEventBtn">אירוע יחיד</button>
                            <button type="button" class="mode-btn" id="dateRangeBtn">טווח תאריכים</button>
                        </div>
                        
                        <div id="singleDateGroup">
                            <input type="date" id="eventDate" required>
                        </div>
                        
                        <div id="dateRangeGroup" class="date-range-group hidden">
                            <div class="form-group" style="flex: 1;">
                                <label for="fromDate">מתאריך:</label>
                                <input type="date" id="fromDate">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label for="toDate">עד תאריך:</label>
                                <input type="date" id="toDate">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <button id="generateBtn" class="generate-btn">צור דוח</button>
                    </div>
                </div>
            </div>
            
            <!-- תוצאות -->
            <div class="results-section" id="resultsSection">
                <!-- סטטיסטיקות -->
                <div class="summary-stats" id="summaryStats">
                    <div class="stat-card">
                        <div class="stat-number" id="totalProducts">0</div>
                        <div class="stat-label">סוגי מוצרים</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalQuantity">0</div>
                        <div class="stat-label">יחידות שנמכרו</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalRevenue">₪0</div>
                        <div class="stat-label">הכנסות כולל</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="topProduct">-</div>
                        <div class="stat-label">המוצר הנמכר ביותר</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalEvents">0</div>
                        <div class="stat-label">מספר אירועים</div>
                    </div>
                </div>
                
                <!-- גרף -->
                <div class="chart-section">
                    <div class="chart-container">
                        <div class="chart-title">התפלגות מכירות</div>
                        <canvas id="salesChart" class="chart-canvas"></canvas>
                    </div>
                </div>
                
                <!-- פילטרים וכפתורים -->
                <div class="filters">
                    <div class="filter-group">
                        <button id="exportBtn" class="export-btn">📊 יצא לאקסל</button>
                    </div>
                </div>
                
                <!-- טבלה -->
                <div class="table-container">
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th style="width: 200px;">מוצר</th>
                                <th style="width: 100px;">כמות</th>
                                <th style="width: 100px;">אחוז</th>
                                <th style="width: 120px;">הכנסות</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- הנתונים ייטענו כאן -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div id="loadingIndicator" class="loading" style="display: none;">
                טוען נתונים...
            </div>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
        // URL של Google Apps Script
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxffpyixPtnfRSgrA7eSb_1eTZ_-k4Cm4kz1Me6XeyAsouEVXyE8zmmEQWZH2gDEoZg/exec';
        
        let currentData = [];
        let productsData = {}; // מידע על המוצרים (emoji, מחיר)
        let salesChart = null;
        
        // אתחול הדף
        document.addEventListener('DOMContentLoaded', function() {
            // הגדרת תאריך היום כברירת מחדל
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            document.getElementById('eventDate').value = todayStr;
            document.getElementById('fromDate').value = todayStr;
            document.getElementById('toDate').value = todayStr;
            
            // Event listeners
            document.getElementById('singleEventBtn').addEventListener('click', () => toggleDateMode('single'));
            document.getElementById('dateRangeBtn').addEventListener('click', () => toggleDateMode('range'));
            document.getElementById('generateBtn').addEventListener('click', generateReport);
            document.getElementById('exportBtn').addEventListener('click', exportToExcel);
            
            // טעינת מידע מוצרים
            loadProductsInfo();
        });
        
        // החלפה בין מצבי תאריך
        function toggleDateMode(mode) {
            const singleBtn = document.getElementById('singleEventBtn');
            const rangeBtn = document.getElementById('dateRangeBtn');
            const singleGroup = document.getElementById('singleDateGroup');
            const rangeGroup = document.getElementById('dateRangeGroup');
            
            if (mode === 'single') {
                singleBtn.classList.add('active');
                rangeBtn.classList.remove('active');
                singleGroup.classList.remove('hidden');
                rangeGroup.classList.add('hidden');
            } else {
                singleBtn.classList.remove('active');
                rangeBtn.classList.add('active');
                singleGroup.classList.add('hidden');
                rangeGroup.classList.remove('hidden');
            }
        }
        
        // טעינת מידע מוצרים מהשרת
        async function loadProductsInfo() {
            try {
                const params = new URLSearchParams({
                    action: 'getProducts'
                });
                
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        result.products.forEach(product => {
                            productsData[product.name] = {
                                emoji: product.emoji,
                                price: product.price,
                                category: product.category
                            };
                        });
                        console.log('נטען מידע על', Object.keys(productsData).length, 'מוצרים');
                    }
                }
            } catch (error) {
                console.error('שגיאה בטעינת מידע מוצרים:', error);
            }
        }
        
        // קיבוץ מוצרים דומים
        function groupSimilarProducts(productName) {
            const name = productName.toLowerCase();
            
            // קיבוץ יינות
            if (name.includes('יין')) {
                return 'יין (כל הסוגים)';
            }
            
            // קיבוץ ויסקי סאוור
            if (name.includes('ויסקי סאוור')) {
                return 'ויסקי סאוור (כל הסוגים)';
            }
            
            return productName; // ללא שינוי
        }
        
        // יצירת דוח
        async function generateReport() {
            const isSingleMode = document.getElementById('singleEventBtn').classList.contains('active');
            const eventDate = document.getElementById('eventDate').value;
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;
            
            if (isSingleMode && !eventDate) {
                alert('אנא בחר תאריך אירוע');
                return;
            }
            
            if (!isSingleMode && (!fromDate || !toDate)) {
                alert('אנא בחר טווח תאריכים');
                return;
            }
            
            if (!isSingleMode && new Date(fromDate) > new Date(toDate)) {
                alert('תאריך ההתחלה צריך להיות לפני תאריך הסיום');
                return;
            }
            
            showLoading(true);
            
            try {
                // שליפת נתונים עיקריים
                const orders = await fetchOrdersData(isSingleMode, eventDate, fromDate, toDate);
                currentData = processProductsData(orders);
                
                // הצגת התוצאות
                displayResults(orders, isSingleMode);
                
            } catch (error) {
                console.error('שגיאה ביצירת הדוח:', error);
                showError('שגיאה בטעינת הנתונים: ' + error.message);
            } finally {
                showLoading(false);
            }
        }
        
        // שליפת נתוני הזמנות
        async function fetchOrdersData(isSingleMode, eventDate, fromDate, toDate) {
            const params = new URLSearchParams({
                action: isSingleMode ? 'getOrdersByEvent' : 'getRecentOrdersFromMain',
                limit: 1000
            });
            
            if (isSingleMode) {
                params.append('eventDate', eventDate);
            }
            
            const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });
            
            if (!response.ok) {
                throw new Error(`שגיאה ${response.status}`);
            }
            
            const result = await response.json();
            if (!result.success) {
                throw new Error(result.message);
            }
            
            let orders = result.orders || [];
            
            // סינון לטווח תאריכים אם לא במצב אירוע יחיד
            if (!isSingleMode) {
                orders = orders.filter(order => {
                    // כאן צריך להוסיף לוגיקת סינון תאריכים
                    return true; // זמני - יחזיר הכל
                });
            }
            
            return orders;
        }
        
        // עיבוד נתוני מוצרים
        function processProductsData(orders) {
            const productCounts = {};
            const productRevenues = {};
            
            orders.forEach(order => {
                const products = (order.products || '').split(', ');
                const orderTotal = parseInt(order.total) || 0;
                
                products.forEach(productStr => {
                    const product = productStr.trim();
                    if (!product || product.includes('₪') || product.startsWith('הנחה') || product.includes('טיפ')) {
                        return; // דילוג על פריטים שאינם מוצרים
                    }
                    
                    // חילוץ כמות
                    const quantityMatch = product.match(/^(.+?)\s*\((\d+)\)$/);
                    let productName, quantity;
                    
                    if (quantityMatch) {
                        productName = quantityMatch[1].trim();
                        quantity = parseInt(quantityMatch[2]);
                    } else {
                        productName = product;
                        quantity = 1;
                    }
                    
                    // קיבוץ מוצרים דומים
                    const groupedName = groupSimilarProducts(productName);
                    
                    // עדכון כמויות
                    productCounts[groupedName] = (productCounts[groupedName] || 0) + quantity;
                    
                    // עדכון הכנסות
                    const productInfo = productsData[productName] || productsData[groupedName];
                    if (productInfo) {
                        const revenue = quantity * productInfo.price;
                        productRevenues[groupedName] = (productRevenues[groupedName] || 0) + revenue;
                    }
                });
            });
            
            // המרה למערך מסודר
            const productsArray = Object.entries(productCounts).map(([name, count]) => ({
                name,
                quantity: count,
                revenue: productRevenues[name] || 0,
                emoji: getProductEmoji(name),
                price: getProductPrice(name)
            }));
            
            // מיון לפי כמות (יורד)
            return productsArray.sort((a, b) => b.quantity - a.quantity);
        }
        
        // קבלת אמוג'י למוצר (כולל מוצרים מקובצים)
        function getProductEmoji(productName) {
            if (productName === 'יין (כל הסוגים)') return '🍷';
            if (productName === 'ויסקי סאוור (כל הסוגים)') return '🥃';
            
            // חיפוש במוצרים הרגילים
            for (const [originalName, info] of Object.entries(productsData)) {
                if (originalName === productName) {
                    return info.emoji;
                }
            }
            
            return '🍽️'; // ברירת מחדל
        }
        
        // קבלת מחיר למוצר
        function getProductPrice(productName) {
            // עבור מוצרים מקובצים - נקח את המחיר הממוצע
            if (productName === 'יין (כל הסוגים)') return 25;
            if (productName === 'ויסקי סאוור (כל הסוגים)') return 30;
            
            for (const [originalName, info] of Object.entries(productsData)) {
                if (originalName === productName) {
                    return info.price;
                }
            }
            
            return 0;
        }
        
        // ספירת אירועים ייחודיים
        function countUniqueEvents(orders) {
            const uniqueDates = new Set();
            
            orders.forEach(order => {
                if (order.date) {
                    uniqueDates.add(order.date);
                }
            });
            
            return uniqueDates.size;
        }
        
        // הצגת התוצאות
        function displayResults(orders, isSingleMode) {
            updateStatistics(orders, isSingleMode);
            updateChart();
            updateTable();
            
            document.getElementById('resultsSection').style.display = 'block';
        }
        
        // עדכון סטטיסטיקות
        function updateStatistics(orders, isSingleMode) {
            const totalProducts = currentData.length;
            const totalQuantity = currentData.reduce((sum, item) => sum + item.quantity, 0);
            const totalRevenue = currentData.reduce((sum, item) => sum + item.revenue, 0);
            const topProduct = currentData.length > 0 ? currentData[0].name : '-';
            const totalEvents = isSingleMode ? 1 : countUniqueEvents(orders);
            
            document.getElementById('totalProducts').textContent = totalProducts;
            document.getElementById('totalQuantity').textContent = totalQuantity;
            document.getElementById('totalRevenue').textContent = `₪${totalRevenue}`;
            document.getElementById('topProduct').textContent = topProduct;
            document.getElementById('totalEvents').textContent = totalEvents;
        }
        
        // עדכון גרף עוגה עם מספרים
        function updateChart() {
            console.log('🍩 מעדכן גרף עוגה...');
            
            const ctx = document.getElementById('salesChart').getContext('2d');
            
            if (salesChart) {
                salesChart.destroy();
                console.log('🗑️ הסיר גרף קודם');
            }
            
            if (currentData.length === 0) {
                console.log('❌ אין נתונים לגרף');
                return;
            }
            
            const top10 = currentData.slice(0, 10);
            const totalQuantity = currentData.reduce((sum, item) => sum + item.quantity, 0);
            
            console.log('🔝 TOP 10 מוצרים לגרף עוגה:', top10.map(item => `${item.name}: ${item.quantity}`));
            
            const colors = [
                '#E67E22', '#3498DB', '#2ECC71', '#E74C3C', '#9B59B6',
                '#F1C40F', '#1ABC9C', '#34495E', '#E67E22', '#95A5A6'
            ];
            
            salesChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: top10.map(item => item.name),
                    datasets: [{
                        data: top10.map(item => item.quantity),
                        backgroundColor: colors.slice(0, top10.length),
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                usePointStyle: true,
                                font: {
                                    size: 12
                                },
                                padding: 15
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const quantity = context.parsed;
                                    const percentage = ((quantity / totalQuantity) * 100).toFixed(1);
                                    return `${context.label}: ${quantity} יחידות (${percentage}%)`;
                                }
                            }
                        }
                    },
                    // הוספת מספרים על הגרף
                    animation: {
                        animateScale: true,
                        animateRotate: true
                    }
                },
                plugins: [{
                    afterDatasetsDraw: function(chart) {
                        const ctx = chart.ctx;
                        chart.data.datasets.forEach((dataset, i) => {
                            const meta = chart.getDatasetMeta(i);
                            meta.data.forEach((element, index) => {
                                const quantity = dataset.data[index];
                                const percentage = ((quantity / totalQuantity) * 100).toFixed(1);
                                
                                // מיקום הטקסט
                                const position = element.tooltipPosition();
                                
                                // עיצוב הטקסט
                                ctx.fillStyle = '#fff';
                                ctx.font = 'bold 12px Arial';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                
                                // רק אם הפלח גדול מספיק
                                if (percentage > 5) {
                                    ctx.fillText(`${quantity}`, position.x, position.y - 5);
                                    ctx.fillText(`(${percentage}%)`, position.x, position.y + 8);
                                }
                            });
                        });
                    }
                }]
            });
            
            console.log('✅ גרף עוגה נוצר');
        }
        
        // עדכון טבלה
        function updateTable() {
            const tbody = document.getElementById('productsTableBody');
            
            if (currentData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="no-data">
                            אין נתונים להצגה עבור התקופה שנבחרה
                        </td>
                    </tr>
                `;
                return;
            }
            
            const totalQuantity = currentData.reduce((sum, item) => sum + item.quantity, 0);
            
            tbody.innerHTML = currentData.map(item => {
                const percentage = totalQuantity > 0 ? ((item.quantity / totalQuantity) * 100).toFixed(1) : 0;
                
                return `
                    <tr>
                        <td>
                            <div class="product-name">
                                <span class="product-emoji">${item.emoji}</span>
                                ${item.name}
                            </div>
                        </td>
                        <td class="quantity-cell">${item.quantity}</td>
                        <td class="percentage-cell">${percentage}%</td>
                        <td class="quantity-cell">₪${item.revenue}</td>
                    </tr>
                `;
            }).join('');
        }
        
        // יצוא לאקסל
        function exportToExcel() {
            if (currentData.length === 0) {
                alert('אין נתונים ליצוא');
                return;
            }
            
            const isSingleMode = document.getElementById('singleEventBtn').classList.contains('active');
            const eventDate = document.getElementById('eventDate').value;
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;
            
            const totalQuantity = currentData.reduce((sum, item) => sum + item.quantity, 0);
            
            const exportData = currentData.map(item => {
                const percentage = totalQuantity > 0 ? ((item.quantity / totalQuantity) * 100).toFixed(1) : 0;
                
                return {
                    'מוצר': item.name,
                    'כמות': item.quantity,
                    'אחוז': `${percentage}%`,
                    'הכנסות': `₪${item.revenue}`,
                    'מחיר יחידה': `₪${item.price}`
                };
            });
            
            // יצירת קובץ Excel
            const ws = XLSX.utils.json_to_sheet(exportData);
            
            // RTL
            if (!ws['!worksheetOptions']) ws['!worksheetOptions'] = {};
            ws['!worksheetOptions']['rightToLeft'] = true;
            
            // רוחבי עמודות
            ws['!cols'] = [
                { width: 25 }, // מוצר
                { width: 10 }, // כמות
                { width: 10 }, // אחוז
                { width: 12 }, // הכנסות
                { width: 12 }  // מחיר יחידה
            ];
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'סיכום מוצרים');
            
            // שם קובץ
            const dateStr = isSingleMode ? eventDate : `${fromDate}_עד_${toDate}`;
            const fileName = `פרתיה_סיכום_מוצרים_${dateStr}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }
        
        // הצגת טעינה
        function showLoading(show) {
            const loading = document.getElementById('loadingIndicator');
            const results = document.getElementById('resultsSection');
            const generateBtn = document.getElementById('generateBtn');
            
            if (show) {
                loading.style.display = 'block';
                results.style.display = 'none';
                generateBtn.disabled = true;
            } else {
                loading.style.display = 'none';
                generateBtn.disabled = false;
            }
        }
        
        // הצגת שגיאה
        function showError(message) {
            const results = document.getElementById('resultsSection');
            results.innerHTML = `<div class="error-message">${message}</div>`;
            results.style.display = 'block';
        }
    </script>
</body>
</html>
